name: Claude Auth Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Test Claude auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "token length: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            sk-ant-oat01-*) echo "prefix: correct (sk-ant-oat01-)";;
            sk-ant-*) echo "prefix: sk-ant- but not an oat01 OAuth token";;
            *) echo "prefix: WRONG - does not start with sk-ant-";;
          esac
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            *"#"*) echo "contains '#': looks like a browser authorization code, not the final token";;
            *) echo "no '#' present";;
          esac
          claude -p "Reply with the single word: ok" --output-format json 2>&1 | tail -20 || true
